# Local production-like stack. Copy .env.example to .env and fill in values first.
#   docker compose up -d db redis        # just the databases (run the API with -Dspring.profiles.active=postgres)
#   docker compose up -d --build         # databases + API
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-travelmate}
      POSTGRES_USER: ${DB_USER:-travelmate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Phase 2: distributed rate limiting and caching. The Phase 1 API does not require it.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: ./travelmate-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-travelmate}
      DB_USER: ${DB_USER:-travelmate}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ bytes)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      TRAVELMATE_BOOTSTRAP_ADMIN_EMAIL: ${TRAVELMATE_BOOTSTRAP_ADMIN_EMAIL:-}
      TRAVELMATE_BOOTSTRAP_ADMIN_PASSWORD: ${TRAVELMATE_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
